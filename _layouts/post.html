---
layout: default
---

<div id="blog">
<header class="post-header">
<h2>{{ title }}</h2>
<div class="post-meta">Published {{ date | date: "%B %d, %Y" }}</div>
</header>

{{ content }}

{% if seriesTitle %}
<p><a href="{{ page.inputPath | series_url }}">&larr; back to {{ seriesTitle }}</a></p>
{% else %}
<p><a href="/">&larr; back home</a></p>
{% endif %}
</div>
